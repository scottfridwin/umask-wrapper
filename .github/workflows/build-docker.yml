name: Build, Test & Release umask-wrapper (multi-arch)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  version: 1.0.${{ github.run_number }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (with QEMU)
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Build all architectures
        run: |
          ARCHS=(x86_64 arm64 armv7 i386)
          for ARCH in "${ARCHS[@]}"; do
            echo "Building for $ARCH..."
            mkdir -p dist/$ARCH
            case $ARCH in
              x86_64) PLATFORM=linux/amd64 ;;
              arm64)  PLATFORM=linux/arm64 ;;
              armv7)  PLATFORM=linux/arm/v7 ;;
              i386)   PLATFORM=linux/386 ;;
            esac

            docker buildx build \
              --platform $PLATFORM \
              --output type=local,dest=dist \
              -f Dockerfile.build .

            file dist/umask-wrapper
            mv dist/umask-wrapper dist/umask-wrapper.$ARCH
          done

      - name: Test binary (runner arch only)
        run: |
          docker run --rm -v $PWD:/tmp alpine:latest sh -c "\
            APP_UMASK=0077 /tmp/umask-wrapper.x86_64 touch /tmp/testfile && \
            ls -l /tmp/testfile && \
            rm -f /tmp/testfile \
          "

      - name: Create Git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag ${{ env.version }}
          git push origin ${{ env.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.version }}
          name: Release ${{ env.version }}
          files: |
            dist/umask-wrapper.x86_64
            dist/umask-wrapper.arm64
            dist/umask-wrapper.armv7
            dist/umask-wrapper.i386
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
